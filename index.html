    <noscript>
      <h1>Image Lab</h1>
      <p>
        Image Lab edits images entirely inside your browser: remove or
        replace a background, extract a colour palette, swap, delete or
        duotone colours, adjust brightness and contrast, redact parts of an
        image, crop, resize, upscale, rotate and dither. It also vectorizes a
        raster image to SVG and converts between PNG, JPG, WebP, AVIF and
        SVG, and can apply the same edits to a batch of images at once. Every
        edit runs locally using WebAssembly and, where available, the GPU —
        no image is ever uploaded or stored on a server. This page needs
        JavaScript enabled to load an image and start editing.
      </p>
